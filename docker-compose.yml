
services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: pantry_manager_dev
      POSTGRES_USER: pantry_user
      POSTGRES_PASSWORD: 1234
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "pantry_user"]
      interval: 5s
      retries: 5

  # You can add your FastAPI backend as a service later!
  # backend:
  #   build: ./backend
  #   command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
  #   volumes:
  #     - ./backend:/app
  #   ports:
  #     - "8000:8000"
  #   environment:
  #     - DATABASE_URL=postgresql+psycopg2://pantry_user:yourpassword@db:5432/pantry_manager_dev
  #   depends_on:
  #     - db

volumes:
  postgres_data: